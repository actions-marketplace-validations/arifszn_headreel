name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # The first version of a package cannot use trusted publishing, so it is
      # published by hand. Skip the publish when the version is already on npm.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "headreel@$version" version >/dev/null 2>&1; then
            echo "headreel@$version is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag

      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
